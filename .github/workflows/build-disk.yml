---
name: Build installer or VM disk
on:
  workflow_dispatch:
    inputs:
      image:
        description: Which image
        required: true
        type: choice
        options:
          - oneclick-os-preview
          - oneclick-os
          - oneclick-os-nvidia
      type:
        description: qcow2 = ready-to-boot VM disk, anaconda-iso = installer for a real PC
        required: true
        type: choice
        options:
          - qcow2
          - anaconda-iso

jobs:
  build:
    name: ${{ inputs.image }} ${{ inputs.type }}
    runs-on: ${{ inputs.image == 'oneclick-os-preview' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ inputs.image }}
      DISK_TYPE: ${{ inputs.type }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free up disk space
        if: inputs.image != 'oneclick-os-preview'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Install podman
        if: inputs.image == 'oneclick-os-preview'
        run: sudo apt-get update -y && sudo apt-get install -y podman

      - name: Prepare
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}:latest"
          sed -i "s|__IMAGE_REF__|${IMAGE_REF}|" disk_config/iso.toml
          echo "IMAGE_REF=${IMAGE_REF}" >> "${GITHUB_ENV}"
          echo "USER_UID=$(id -u)" >> "${GITHUB_ENV}"
          echo "USER_GID=$(id -g)" >> "${GITHUB_ENV}"
          echo "${TOKEN}" | sudo podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build disk image
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ${{ inputs.type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REF }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ inputs.type }}
          # The Fedora base of the preview does not declare a default filesystem, so name one.
          additional-args: ${{ inputs.image == 'oneclick-os-preview' && '--use-librepo=True --rootfs btrfs' || '--use-librepo=True' }}

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.image }}-${{ inputs.type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true
